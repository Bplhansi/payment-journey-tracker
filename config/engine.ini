# Engine settings. All times are in milliseconds of payment time.

# How long a payment may stay in each stage before it counts as stuck.
# Healthy payments in the simulator take 0.1 to 1.2 s per stage, and a few "normal slow"
# ones take up to 3.5 s, so these limits leave a safe margin.
[stuck_after_ms]
Received = 4000
Validated = 4000
Screened = 5000
Sent = 6000

[ordering]
# How long an early event waits for the event that should have come before it.
reorder_wait_ms = 1500
# How many recent event IDs to remember for spotting duplicates.
dedupe_capacity = 200000

[memory]
# How long finished payments stay in memory (late duplicates are still recognised).
retention_ms = 30000

[snapshot]
# Crash recovery. The live engine (pjt_stream) saves its state at most this often, and
# acknowledges events only after they are inside a saved snapshot.
every_ms = 1000
# The file replay (pjt_replay --snapshot) saves after this many events.
every_events = 5000

[slowdown]
enabled = true
# Warn when a stage's recent average time is this many times its normal average.
ratio = 1.5
warmup = 200
fast_alpha = 0.05
slow_alpha = 0.001
